services:
  # Mock GitLab API 服务（离线验证用）
  mock-gitlab:
    build:
      context: ./mock-gitlab
      dockerfile: Dockerfile
    container_name: mock-gitlab
    ports:
      - "8906:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://localhost:8080/api/v4/projects'); req.add_header('PRIVATE-TOKEN','glpat-mock-token-for-testing'); urllib.request.urlopen(req)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # GitLab 代码统计 CLI 工具
  gitlab-stats:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitlab-stats
    environment:
      - GITLAB_URL=${GITLAB_URL:-http://mock-gitlab:8080}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-glpat-mock-token-for-testing}
    volumes:
      - ./output:/app/output
    depends_on:
      mock-gitlab:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["--help"]
